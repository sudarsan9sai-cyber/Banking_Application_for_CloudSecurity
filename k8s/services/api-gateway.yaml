---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  namespace: banking
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: banking-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: api-gateway
          image: 799823514784.dkr.ecr.ap-south-1.amazonaws.com/banking-platform:api-gateway-latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: api-gateway-secret
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: "1"
              memory: 192Mi
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: banking
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: banking-platform
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: banking
  labels:
    app: api-gateway
data:
  SERVICE_NAME: "api-gateway"
  ENVIRONMENT: "development"
  HTTP_PORT: "8080"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  CORS_ALLOWED_ORIGINS: "*"
  UPSTREAM_SCHEME: "http"
  UPSTREAM_PORT: "8080"
  OTEL_ENABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector.observability.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_INSECURE: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: banking
  labels:
    app: api-gateway
type: Opaque
stringData:
  JWT_SECRET: "dev-secret-change-me"
  JWT_ISSUER: "banking-platform"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: banking
  labels:
    app: api-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway-deployment
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
