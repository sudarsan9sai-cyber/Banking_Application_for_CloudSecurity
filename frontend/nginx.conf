# nginx config for serving the SPA and proxying API calls to the gateway.
#
# Gateway hostname selection:
#   Docker Compose (local dev): "api-gateway"  — resolved by Docker's internal DNS (127.0.0.11)
#   Kubernetes / EKS:           ingress (Traefik) fronts the SPA, so this proxy block
#                               is not the primary traffic path in-cluster.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 10.100.0.10 = EKS CoreDNS resolver; 127.0.0.11 = Docker embedded resolver
    resolver 10.100.0.10 127.0.0.11 valid=5s ipv6=off;

    location /api/ {
        set $gw "api-gateway";
        proxy_pass http://$gw:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
