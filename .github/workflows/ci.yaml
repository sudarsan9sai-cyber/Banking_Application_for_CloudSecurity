# ==============================================================================
# Banking Platform CI — Amazon ECR Build & Push
# ==============================================================================
# Pipeline overview:
#   build : Matrix over all backend microservices + frontend
#           -> Docker Buildx (with GitHub Actions layer caching)
#           -> Direct Push to Amazon ECR (tags: <service>-<sha>, <service>-latest)
#
# Required GitHub configuration:
#   Secrets:
#     AWS_ACCESS_KEY_ID     - IAM user access key (with ECR push policy)
#     AWS_SECRET_ACCESS_KEY - Matching secret access key
#   Variables:
#     AWS_REGION     - e.g. us-east-1
#     ECR_REGISTRY   - e.g. <account-id>.dkr.ecr.us-east-1.amazonaws.com
#     ECR_REPOSITORY - e.g. banking-platform
# ==============================================================================

name: CI (Build & Push to ECR)

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "frontend/**"
      - "pkg/**"
      - "proto/**"
      - "build/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    paths:
      - "services/**"
      - "frontend/**"
      - "pkg/**"
      - "proto/**"
      - "build/**"
      - ".github/workflows/ci.yaml"
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  IMAGE_PREFIX: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}

jobs:
  # ===========================================================================
  # build: Build and push every service in parallel via a matrix.
  # ===========================================================================
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - authz-service
          - customer-service
          - profile-service
          - kyc-service
          - document-service
          - ledger-service
          - account-service
          - transaction-service
          - beneficiary-service
          - payment-service
          - wallet-service
          - loan-service
          - emi-service
          - fixed-deposit-service
          - recurring-deposit-service
          - card-service
          - investment-service
          - currency-exchange-service
          - audit-service
          - fraud-service
          - notification-service
          - statement-service
          - reports-service
          - analytics-service
          - search-service
          - email-service
          - sms-service
          - support-service
          - admin-service
          - api-gateway
          - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha=$(echo "${GITHUB_SHA}" | cut -c1-8)" >> "$GITHUB_OUTPUT"

      # Frontend uses frontend/Dockerfile; Go services use build/service.Dockerfile
      - name: Resolve build inputs
        id: img
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "context=./frontend" >> "$GITHUB_OUTPUT"
            echo "dockerfile=./frontend/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "buildargs=" >> "$GITHUB_OUTPUT"
          else
            echo "context=." >> "$GITHUB_OUTPUT"
            echo "dockerfile=build/service.Dockerfile" >> "$GITHUB_OUTPUT"
            echo "buildargs=SERVICE=${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push directly to Amazon ECR
      - name: Build and Push to ECR
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.img.outputs.context }}
          file: ${{ steps.img.outputs.dockerfile }}
          build-args: ${{ steps.img.outputs.buildargs }}
          provenance: false
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}:${{ matrix.service }}-${{ steps.vars.outputs.sha }}
            ${{ env.IMAGE_PREFIX }}:${{ matrix.service }}-latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
